<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Skaitech - Instant Data</title>
  <meta name="description" content="Send instant MTN, Telecel and AirtelTigo data bundles in Ghana, paid from your Skaitech wallet.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://skaitechgh.wasmer.app/instantData.html">
  <link rel="icon" type="image/jpeg" href="img/akaitech%20more%20final%20logo.jpeg">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Dark-only by design: this page mirrors the SwiftVendux data storefront,
       which is dark in both themes. It does not read the site light/dark
       toggle, so the layout does not shift when an agent flips it elsewhere. */
    :root {
      --sv-bg: #0b0f19;
      --sv-surface: #111827;
      --sv-surface-2: #161f31;
      --sv-border: rgba(148, 163, 184, 0.16);
      --sv-border-strong: rgba(148, 163, 184, 0.30);
      --sv-text: #e9eef8;
      --sv-muted: #8b97ad;
      --sv-danger: #ef4444;
      --sv-danger-soft: rgba(239, 68, 68, 0.12);
      --sv-ok: #22c55e;
      /* Uniform dark navy accent. Not overridden per network: a single accent
         keeps the page cohesive and the bundle list readable. */
      --sv-accent: #1e40af;
      --sv-accent-ink: #ffffff;
    }

    html, body {
      background: var(--sv-bg);
      color: var(--sv-text);
    }

    body {
      margin: 0;
      padding: 0 14px 132px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .sv-page {
      width: 100%;
      max-width: 480px;
      margin: 22px auto 0;
    }

    /* ---------- network tabs ---------- */
    .sv-tabs {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 12px;
    }
    .sv-tab {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 8px;
      border: 1px solid var(--sv-border);
      border-radius: 12px;
      background: var(--sv-surface);
      color: var(--sv-muted);
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      transition: border-color .18s ease, color .18s ease, background .18s ease;
    }
    .sv-tab:hover { border-color: var(--sv-border-strong); color: var(--sv-text); }
    .sv-tab.active {
      border-color: var(--sv-accent);
      color: var(--sv-text);
      background: var(--sv-surface-2);
    }
    .sv-tab-dot {
      width: 20px; height: 20px; border-radius: 6px;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 0.6rem; font-weight: 900; color: #fff;
      flex: 0 0 20px;
    }

    /* ---------- header banner card ---------- */
    .sv-hero {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px;
      border: 1px solid var(--sv-border);
      border-radius: 16px;
      background: linear-gradient(135deg, color-mix(in srgb, var(--sv-accent) 24%, var(--sv-surface-2)) 0%, var(--sv-surface) 76%);
      border-top: 4px solid var(--sv-accent);
      box-shadow: 0 10px 30px -12px rgba(0, 0, 0, 0.7);
      margin-bottom: 12px;
    }
    .sv-hero-badge {
      width: 46px; height: 46px; flex: 0 0 46px;
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.8rem; font-weight: 900; color: #fff;
    }
    .sv-hero-text { min-width: 0; flex: 1; }
    .sv-hero-name {
      margin: 0 0 3px;
      font-size: 1.02rem;
      font-weight: 800;
      letter-spacing: -0.2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .sv-hero-tag { margin: 0; font-size: 0.74rem; color: var(--sv-muted); }
    .sv-hero-profit { margin: 6px 0 0; font-size: 0.72rem; font-weight: 800; color: var(--sv-ok); display: none; }
    .sv-hero-profit.show { display: block; }
    .sv-hero-price {
      flex: 0 0 auto;
      padding: 7px 12px;
      border-radius: 9999px;
      background: var(--sv-accent);
      color: var(--sv-accent-ink);
      font-size: 0.9rem;
      font-weight: 900;
      white-space: nowrap;
    }
    .sv-hero-price.muted { background: var(--sv-surface); color: var(--sv-muted); }

    /* ---------- cards ---------- */
    .sv-card {
      border: 1px solid var(--sv-border);
      border-radius: 16px;
      background: var(--sv-surface);
      padding: 16px;
      margin-bottom: 12px;
    }
    .sv-label {
      display: block;
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.7px;
      text-transform: uppercase;
      color: var(--sv-muted);
      margin-bottom: 8px;
    }

    /* ---------- recipient input ---------- */
    .sv-input-wrap { position: relative; }
    .sv-input-wrap > i {
      position: absolute;
      left: 13px; top: 50%;
      transform: translateY(-50%);
      color: var(--sv-muted);
      font-size: 0.9rem;
      pointer-events: none;
    }
    .sv-input {
      width: 100%;
      box-sizing: border-box;
      padding: 13px 14px 13px 38px;
      border: 1px solid var(--sv-border);
      border-radius: 12px;
      background: var(--sv-surface-2);
      color: var(--sv-text);
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.6px;
      outline: none;
      transition: border-color .18s ease, box-shadow .18s ease;
    }
    .sv-input::placeholder { color: #64748b; letter-spacing: normal; font-weight: 500; }
    .sv-input:focus {
      border-color: var(--sv-accent);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--sv-accent) 18%, transparent);
    }
    .sv-input.invalid { border-color: var(--sv-danger); }
    .sv-hint {
      display: none;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
      font-size: 0.76rem;
      font-weight: 700;
    }
    .sv-hint.show { display: flex; }
    .sv-hint.ok { color: var(--sv-ok); }
    .sv-hint.bad { color: var(--sv-danger); }

    /* ---------- bundle list ---------- */
    .sv-card-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }
    .sv-card-head h2 {
      margin: 0;
      font-size: 0.95rem;
      font-weight: 800;
    }
    .sv-card-head span { font-size: 0.72rem; color: var(--sv-muted); font-weight: 700; }

    .sv-bundles {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 46vh;
      overflow-y: auto;
      /* Room for the focus ring so a scrolled row is not clipped at the edge. */
      padding: 2px;
      scrollbar-width: thin;
      scrollbar-color: var(--sv-border-strong) transparent;
    }
    .sv-bundles::-webkit-scrollbar { width: 6px; }
    .sv-bundles::-webkit-scrollbar-thumb { background: var(--sv-border-strong); border-radius: 99px; }

    .sv-bundle {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      box-sizing: border-box;
      padding: 13px 14px;
      border: 1px solid var(--sv-border);
      border-radius: 14px;
      background: var(--sv-surface-2);
      color: var(--sv-text);
      font-family: inherit;
      text-align: left;
      cursor: pointer;
      transition: border-color .16s ease, background .16s ease, transform .16s ease;
    }
    .sv-bundle:hover { border-color: var(--sv-border-strong); transform: translateY(-1px); }
    .sv-bundle:focus-visible {
      outline: none;
      border-color: var(--sv-accent);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--sv-accent) 22%, transparent);
    }
    .sv-bundle.selected {
      border-color: var(--sv-accent);
      background: color-mix(in srgb, var(--sv-accent) 10%, var(--sv-surface-2));
    }

    /* Custom radio. The native input stays in the DOM for keyboard and screen
       reader semantics; only its rendering is replaced. */
    .sv-radio {
      position: relative;
      width: 18px; height: 18px; flex: 0 0 18px;
      border: 2px solid var(--sv-border-strong);
      border-radius: 9999px;
      transition: border-color .16s ease;
    }
    .sv-bundle.selected .sv-radio { border-color: var(--sv-accent); }
    .sv-bundle.selected .sv-radio::after {
      content: '';
      position: absolute;
      inset: 3px;
      border-radius: 9999px;
      background: var(--sv-accent);
    }
    .sv-bundle input[type="radio"] {
      position: absolute;
      opacity: 0;
      width: 1px; height: 1px;
      margin: 0;
      pointer-events: none;
    }

    .sv-bundle-info { flex: 1; min-width: 0; }
    .sv-bundle-title {
      display: block;
      font-size: 0.95rem;
      font-weight: 800;
      letter-spacing: -0.1px;
    }
    .sv-bundle-meta {
      display: block;
      margin-top: 2px;
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--sv-muted);
    }
    /* Named vendor package badge (Kokrokoo, Midnight, Voice). */
    .sv-cat {
      display: inline-block;
      margin-top: 3px;
      padding: 1px 8px;
      border-radius: 9999px;
      background: color-mix(in srgb, var(--sv-accent) 18%, transparent);
      border: 1px solid color-mix(in srgb, var(--sv-accent) 45%, transparent);
      color: #a8c0ff;
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 0.4px;
      text-transform: uppercase;
    }

    .sv-bundle-price { flex: 0 0 auto; text-align: right; }
    .sv-price {
      display: block;
      font-size: 0.92rem;
      font-weight: 900;
      color: var(--sv-accent);
    }
    /* Price red plus a Low balance tag, directly under the price. */
    .sv-bundle.unaffordable .sv-price { color: var(--sv-danger); }
    .sv-low {
      display: none;
      margin-top: 4px;
      padding: 2px 7px;
      border-radius: 9999px;
      background: var(--sv-danger-soft);
      border: 1px solid rgba(239, 68, 68, 0.32);
      color: var(--sv-danger);
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 0.3px;
      white-space: nowrap;
    }
    .sv-bundle.unaffordable .sv-low { display: inline-block; }

    .sv-bundle.disabled { opacity: 0.45; cursor: not-allowed; }
    .sv-bundle.disabled:hover { transform: none; border-color: var(--sv-border); }
    .sv-unavailable {
      display: block;
      margin-top: 4px;
      color: #fca5a5;
      font-size: 0.6rem;
      font-weight: 800;
      white-space: nowrap;
    }

    /* ---------- notice ---------- */
    .sv-notice {
      display: none;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 0.82rem;
      font-weight: 600;
      line-height: 1.45;
      margin-bottom: 12px;
    }
    .sv-notice.show { display: block; }
    .sv-notice.error {
      background: var(--sv-danger-soft);
      border: 1px solid rgba(239, 68, 68, 0.32);
      color: #fca5a5;
    }
    .sv-notice.info {
      background: rgba(30, 64, 175, 0.14);
      border: 1px solid rgba(30, 64, 175, 0.4);
      color: #a8c0ff;
    }

    .sv-empty {
      padding: 22px 12px;
      text-align: center;
      color: var(--sv-muted);
      font-size: 0.82rem;
      font-weight: 600;
      line-height: 1.5;
    }

    /* ---------- footer bar ---------- */
    .sv-footer {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      z-index: 40;
      display: flex;
      align-items: center;
      gap: 12px;
      box-sizing: border-box;
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      background: rgba(11, 15, 25, 0.94);
      backdrop-filter: blur(10px);
      border-top: 1px solid var(--sv-border);
    }
    .sv-balance { flex: 0 0 auto; }
    .sv-balance-label {
      display: block;
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: var(--sv-muted);
    }
    .sv-balance-value {
      display: block;
      margin-top: 2px;
      font-size: 0.98rem;
      font-weight: 900;
      color: var(--sv-text);
      white-space: nowrap;
    }
    .sv-send {
      flex: 1;
      min-width: 0;
      padding: 14px 12px;
      border: none;
      border-radius: 12px;
      background: var(--sv-accent);
      color: var(--sv-accent-ink);
      font-family: inherit;
      font-size: 0.86rem;
      font-weight: 900;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: opacity .16s ease;
    }
    .sv-send:hover:not(:disabled) { opacity: 0.9; }
    .sv-send:disabled {
      background: var(--sv-surface-2);
      color: var(--sv-muted);
      cursor: not-allowed;
    }

    /* ---------- result overlay ---------- */
    .sv-overlay {
      position: fixed; inset: 0; z-index: 1000;
      display: none;
      align-items: center; justify-content: center;
      padding: 20px;
      background: rgba(2, 6, 16, 0.78);
    }
    .sv-overlay.active { display: flex; }
    .sv-modal {
      width: 100%;
      max-width: 360px;
      box-sizing: border-box;
      padding: 26px 22px;
      border: 1px solid var(--sv-border);
      border-radius: 18px;
      background: var(--sv-surface);
      text-align: center;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
    }
    .sv-modal-icon { font-size: 2.4rem; margin-bottom: 10px; }
    .sv-modal-title { margin: 0 0 6px; font-size: 1.1rem; font-weight: 800; }
    .sv-modal-desc { margin: 0 0 16px; font-size: 0.85rem; color: var(--sv-muted); line-height: 1.5; }
    .sv-modal-ref {
      padding: 10px;
      margin-bottom: 16px;
      border-radius: 10px;
      background: var(--sv-surface-2);
      font-family: ui-monospace, Consolas, monospace;
      font-size: 0.78rem;
      color: var(--sv-accent);
      word-break: break-all;
    }
    .sv-modal-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 22px;
      border: none;
      border-radius: 10px;
      background: var(--sv-accent);
      color: var(--sv-accent-ink);
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 800;
      cursor: pointer;
      text-decoration: none;
    }

    @media (max-width: 420px) {
      body { padding: 0 10px 128px; }
      .sv-page { margin-top: 14px; }
      .sv-bundles { max-height: 42vh; }
      .sv-tab span:not(.sv-tab-dot) { display: none; }
      .sv-send { font-size: 0.8rem; padding: 13px 8px; }
    }
  </style>
</head>
<body>
  <div class="sv-page">
    <div id="svNotice" class="sv-notice"></div>

    <div class="sv-tabs" id="networkTabs" role="tablist" aria-label="Mobile network"></div>

    <!-- Header banner: active network, tagline, and the selected bundle's price. -->
    <section class="sv-hero">
      <span class="sv-hero-badge" id="heroBadge">AT</span>
      <div class="sv-hero-text">
        <h1 class="sv-hero-name" id="heroName">Loading...</h1>
      <p class="sv-hero-tag" id="heroTag">From wallet · Instant delivery</p>
        <p class="sv-hero-profit" id="heroProfit"></p>
      </div>
      <span class="sv-hero-price muted" id="heroPrice">&#8372;0.00</span>
    </section>

    <section class="sv-card">
      <label class="sv-label" for="recipientPhone">Recipient Number</label>
      <div class="sv-input-wrap">
        <i class="fa-solid fa-mobile-screen"></i>
        <input
          type="tel"
          id="recipientPhone"
          class="sv-input"
          placeholder="024XXXXXXX"
          inputmode="numeric"
          autocomplete="tel"
          maxlength="10"
          aria-describedby="phoneHint"
          oninput="handleDataPhoneInput()"
        >
      </div>
      <div id="phoneHint" class="sv-hint"></div>
    </section>

    <section class="sv-card">
      <div class="sv-card-head">
        <h2>Choose a bundle</h2>
        <span id="bundleCount"></span>
      </div>
      <div class="sv-bundles" id="bundleList" role="radiogroup" aria-label="Data bundles"></div>
    </section>
  </div>

  <!-- Footer bar: live wallet balance plus the single action. -->
  <div class="sv-footer">
    <div class="sv-balance">
      <span class="sv-balance-label">Wallet Balance</span>
      <span class="sv-balance-value" id="walletBalance">GH₵ 0.00</span>
    </div>
    <button type="button" id="sendBtn" class="sv-send" disabled onclick="startDataPurchase()">Select a Data Bundle</button>
  </div>

  <div id="resultOverlay" class="sv-overlay" onclick="if(event.target === this) closeDataResult()">
    <div class="sv-modal" role="dialog" aria-modal="true" aria-labelledby="resultTitle">
      <div class="sv-modal-icon" id="resultIcon">&#9989;</div>
      <h3 class="sv-modal-title" id="resultTitle">Order placed</h3>
      <p class="sv-modal-desc" id="resultDesc"></p>
      <div class="sv-modal-ref" id="resultRef">-</div>
      <button type="button" class="sv-modal-btn" onclick="closeDataResult()">Done</button>
    </div>
  </div>

  <script type="module" src="agentNav.js"></script>
  <script type="module" src="instantData.js"></script>
</body>
</html>
