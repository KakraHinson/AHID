<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="robots" content="noindex, nofollow">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skaitech - Orders</title>
  <link rel="icon" type="image/jpeg" href="img/akaitech%20more%20final%20logo.jpeg">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script>
  // Apply the saved theme before first paint, otherwise a dark-mode agent sees
  // a white flash while the shell boots. Kept inline and tiny on purpose.
  try {
    if (localStorage.getItem('skaitech_theme') === 'dark') {
      document.documentElement.classList.add('dark');
    }
  } catch (e) {}
</script>
</head>
<body class="orders-body-yellow">

  <!-- MAIN ORDERS CONTENT -->
  <main class="orders-page-wrapper">
    
    <!-- TRANSACTION SUMMARY CARDS -->
    <div class="tx-stats-grid">
      <div class="tx-stat-card tx-stat-airtime">
        <span class="tx-stat-label"><i class="fa-solid fa-mobile-screen-button"></i> Airtime Purchases</span>
        <strong class="tx-stat-value" id="statAirtime">0</strong>
      </div>
      <div class="tx-stat-card tx-stat-utility">
        <span class="tx-stat-label"><i class="fa-solid fa-bolt"></i> Utility Purchases</span>
        <strong class="tx-stat-value" id="statUtility">0</strong>
      </div>
      <div class="tx-stat-card tx-stat-data">
        <span class="tx-stat-label"><i class="fa-solid fa-wifi"></i> Data Bundle</span>
        <strong class="tx-stat-value" id="statData">0</strong>
      </div>
      <div class="tx-stat-card tx-stat-ok">
        <span class="tx-stat-label"><i class="fa-solid fa-circle-check"></i> Successful</span>
        <strong class="tx-stat-value tx-stat-ok" id="statCompleted">0</strong>
      </div>
      <div class="tx-stat-card tx-stat-bad">
        <span class="tx-stat-label"><i class="fa-solid fa-circle-xmark"></i> Failed</span>
        <strong class="tx-stat-value tx-stat-bad" id="statFailed">0</strong>
      </div>
      <div class="tx-stat-card tx-stat-pending">
        <span class="tx-stat-label"><i class="fa-solid fa-clock"></i> Pending</span>
        <strong class="tx-stat-value tx-stat-pending" id="statPending">0</strong>
      </div>
    </div>

    <!-- SEARCH INPUT -->
    <div class="search-input-wrapper">
      <i class="fa-solid fa-magnifying-glass search-icon"></i>
      <input type="text" id="orderSearch" onkeyup="filterOrders()" placeholder="Search by name, phone, code or reference...">
    </div>

    <!-- SERVICE TYPE TABS (Airtime / Utility / Data / All) -->
    <div class="status-pills service-tabs" id="serviceTabs" style="margin-top: 8px;">
      <button class="pill-btn active" onclick="setServiceTab('all', this)">All Services</button>
      <button class="pill-btn" onclick="setServiceTab('airtime', this)"><i class="fa-solid fa-mobile-screen-button"></i> Airtime</button>
      <button class="pill-btn" onclick="setServiceTab('data', this)"><i class="fa-solid fa-wifi"></i> Data Bundle</button>
      <button class="pill-btn" onclick="setServiceTab('utility', this)"><i class="fa-solid fa-bolt"></i> Utility</button>
    </div>

    <!-- STATUS FILTER PILLS -->
<div class="status-pills" id="statusPills">
    <button class="pill-btn active" onclick="setFilter('all', this)">All</button>
    <button class="pill-btn" onclick="setFilter('pending', this)">Pending</button>
    <button class="pill-btn" onclick="setFilter('processing', this)">Processing</button>
    <button class="pill-btn" onclick="setFilter('completed', this)">Completed</button>
    <button class="pill-btn" onclick="setFilter('failed', this)">Failed</button>
    <button class="pill-btn" onclick="setFilter('cancelled', this)">Cancelled</button>
</div>

    <!-- COUNTER DISPLAY -->
    <div style="display: flex; gap: 8px; align-items: center; justify-content: space-between; margin-top: 10px; margin-bottom: 6px;">
      <div class="orders-count-text" id="ordersCountText" style="margin: 0;">0 orders found</div>
      <button id="refreshOrdersBtn" onclick="loadStoredOrders()" class="pill-btn" style="background: #2563eb; color: #ffffff; border: none; font-size: 0.85rem; padding: 6px 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; border-radius: 6px; font-weight: 600;">
        <i class="fa-solid fa-arrows-rotate"></i> Refresh Live Status
      </button>
    </div>
    <!-- ORDERS DISPLAY CARD -->
   
    <div class="orders-content-card">
      <!-- EMPTY STATE -->
      <div id="emptyState" class="empty-state-box">
        <div class="package-icon">🥅 </div>
        <h3>No orders found</h3>
        <p>You haven't placed any orders yet, or try searching with a different phone number.</p>
      </div>

      <!-- DYNAMIC ORDERS TABLE -->
      <!-- Scroll container: keeps the 7-column table inside the card on narrow
           screens instead of widening the page. -->
      <div class="orders-table-scroll" id="ordersTableScroll">
        <table class="orders-data-table" id="ordersTable" style="display: none;">
          <thead>
            <tr>
              <th>Order ID</th>
              <th>Service</th>
              <th>Recipient</th>
              <th>Details</th>
              <th>Status</th>
              <th>Provider Ref</th>
              <th>Date</th>
            </tr>
          </thead>
          <tbody id="ordersTableBody">
            <!-- Dynamic rows populated via JS -->
          </tbody>
        </table>
      </div>
    </div>

    <!-- PAGINATION CONTROLS -->
    <div class="pagination-container">
      
      <div class="page-size-selector">
        <label for="pageSize">Show:</label>
        <select id="pageSize" onchange="changePageSize(this.value)">
          <option value="10" selected>10</option>
          <option value="20">20</option>
          <option value="30">30</option>
          <option value="50">50</option>
          <option value="100">100</option>
        </select>
        <span>orders per page</span>
      </div>

      <div class="pagination-buttons">
        <button id="prevBtn" onclick="changePage(-1)">Previous</button>
        <span id="pageIndicator">Page 1</span>
        <button id="nextBtn" onclick="changePage(1)">Next</button>
      </div>

    </div>
  </main>

  <script type="module" src="agentNav.js?v=20261103"></script>
  <script type="module" src="script.js"></script>
</body>
</html>
